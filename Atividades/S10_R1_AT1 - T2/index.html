<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Pesquisa de Satisfação</h1>
    <form action="">
        <label for="nome">
            Nome:
        </label>
        <br>
        <input type="text"
        id="nome"
        name="nome"
        required
        placeholder="Digite seu nome completo">
        <br><br>

        <label for="email">
            E-mail:
        </label>
        <br>
        <input type="email"
        required
        placeholder="Digite seu email"
        id="email"
        name="email">
        <br><br>

        <label for="telefone">
            Telefone
        </label>
        <br>
        <input type="tel"
        id="telefone"
        pattern="[0-9]{11}"
        placeholder="(00)00000-0000">
        <br><br>

        <label for="idade">
            Idade
        </label>
        <br>
        <input type="number"
        id="idade"
        name="idade"
        min="10"
        max="120"
        required
        placeholder="Informe a sua Idade">>
        <br><br>


        <h2>Avaliação Geral</h2>

        <p>Como você avalia nosso atendimento?</p>

        <input type="radio" id="otimo" name="avaliacao" value="otimo">
        <label for="otimo">Ótimo</label>

        <br>

        <input type="radio" id="bom" name="avaliacao" value="bom">
        <label for="bom">Bom</label>

        <br>

        <input type="radio" id="regular" name="avaliacao" value="regular">
        <label for="regular">Regular</label>

        <br>

        <input type="radio" id="ruim" name="avaliacao" value="ruim">
        <label for="ruim">Ruim</label>

        <br><br>


        <h2>Serviços Utilizados</h2>

        <p>Quais serviços você utilizou?</p>

        <input type="checkbox" id="atendimento" name="servicos" value="atendimento">
        <label for="atendimento">Atendimento</label>

        <br>

        <input type="checkbox" id="suporte" name="servicos" value="suporte">
        <label for="suporte">Suporte</label>

        <br>

        <input type="checkbox" id="treinamento" name="servicos" value="treinamento">
        <label for="treinamento">Treinamento</label>

        <br>

        <input type="checkbox" id="consultoria" name="servicos" value="consultoria">
        <label for="consultoria">Consultoria</label>

        <br><br>


        <h2>Unidade Atendida</h2>

        <label for="unidade">Escolha a unidade:</label>

        <br>

        <select id="unidade" name="unidade" required>
            <option value="">Selecione uma unidade</option>
            <option value="americana">Americana</option>
            <option value="campinas">Campinas</option>
            <option value="piracicaba">Piracicaba</option>
            <option value="sao-paulo">São Paulo</option>
        </select>

        <br><br>

        <button type="submit">
            Cadastrar
        </button>


    </form>

</body>
</html>
